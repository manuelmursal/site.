</style></head>

const facc=p=>{FR.inc=FR.inc.filter(x=>x!=p);FR.friends.push(p);render()};
const fadd=()=>{const v=+$('#fn').value.replace(/\D/g,''),s=STUD.find(x=>x[2]==v);if(v==pid())toast('Das ist deine eigene Nummer.');else if(!s)toast('Keine Person mit dieser Nummer gefunden.');else rq(v)};
const cgo=()=>{const v=$('#cx').value.trim();if(!v)return;if(ct=='new'){if(CH[v])return toast('Den Namen gibt es schon.');KEYS[v]=Array.from({length:6},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.random()*32|0]).join('');CH[v]=[];ch=v;toast('Dein Schlüssel: '+KEYS[v])}else{const n=Object.keys(PRIV).find(x=>PRIV[x].k==v.toUpperCase());if(!n)return toast('Kein Chat mit diesem Schlüssel.');CH[n]=CH[n]||PRIV[n].m;KEYS[n]=PRIV[n].k;ch=n}ct=0;render()};
const pcs=c=>c?`border-color:${c};background:color-mix(in srgb,${c} 22%,var(--card))`:'',pc=(k,b)=>{const L=['',...COL],c=(S.pc||{})[k]||'',n=L[(L.indexOf(c)+1)%L.length];S.pc={...S.pc,[k]:n};sv('pc',S.pc);b.previousElementSibling.style.cssText=pcs(n);b.style.background=n||'transparent'};
const ps=(k,e)=>{(S.plan??={})[k]=e.value;e.classList.toggle('f',!!e.value);sv('plan',S.plan)};
const wipv=()=>`<div class="card" style="text-align:center;padding:44px 24px;margin-top:40px"><div style="color:var(--acc)">${ic('gear')}</div><h1>In Bearbeitung</h1><p class="m">Diese Seite ist noch nicht fertig. Alles, was du hier machst, wird noch nicht gespeichert.</p><p style="margin:24px 0 0;display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button class="btn g" onclick="bk()">Zurück</button><button class="btn o" onclick="seen['${V}']=1;render()">Trotzdem ansehen</button></p></div>`;
const avUp=i=>{const f=i.files[0];if(!f)return;rd(f).then(d=>{const im=new Image;im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height);c.width=c.height=256;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,256,256);sv('avc',c.toDataURL('image/jpeg',.85));render()};im.src=d})};
const toJ=async s=>{const im=new Image;im.src=s;await im.decode();const k=Math.min(1,1600/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);return[c.toDataURL('image/jpeg',.88),c.width,c.height]};
async function dl(all){const d=await window.claude?.use('downloads');if(!d)return toast('Speichern ist hier nicht verfügbar.');const k=innerWidth>760?2:1,a=all?0:pi,b=all?cur.pages.length:Math.min(pi+k,cur.pages.length);toast('Wird vorbereitet …');try{let pdf;for(let i=a;i<b;i++){const[u,w,h]=await toJ(cur.pages[i]),o=w>h?'l':'p',f=[w*.75,h*.75];if(pdf)pdf.addPage(f,o);else pdf=new window.jspdf.jsPDF({unit:'pt',format:f,orientation:o});pdf.addImage(u,'JPEG',0,0,f[0],f[1])}await d.save({filename:cur.title.replace(/[^\p{L}\p{N} -]/gu,'')+(all?'':' Seite '+(a+1)+(b-a>1?'-'+b:''))+'.pdf',data:pdf.output('blob')})}catch(e){if(e?.code!='declined')toast('Das Speichern hat nicht geklappt.')}}
const VW={
home:()=>`<h1 style="text-align:center;font-size:32px;margin:30px 0 18px">Was möchtest du heute tun?</h1><input style="max-width:520px;display:block;margin:0 auto;border-radius:99px" placeholder="Suchen, zum Beispiel Deutsch" aria-label="Suche" onkeydown="event.key=='Enter'&&gs(this.value)"><div class="tiles">${tl([['dash','Dashboard','Dein Überblick','dash'],['book','Schulbücher','Alle Bücher online','_book'],['stoff','Lernmaterial','Stoff und Mitschriften','lern'],['school','Meine Schule','Chat und Mitschüler','schule'],['plan','Stundenplan','Deine Stunden eintragen','plan'],['user','Mein Profil','Klasse, Schule, Uploads','profil']])}</div>`,
dash:()=>{const d=(new Date().getDay()+6)%7,pl=S.plan||{},ls=d<5?Array.from({length:ROWS},(_,i)=>[i+1,pl[d+'-'+i]]).filter(x=>x[1]):[],nn=DB.filter(x=>!S.stufe||x.stufe==S.stufe).slice(-4).reverse();return `<h1>Hallo${S.name?', '+esc(S.name):''}</h1><p class="m">Dein Überblick für heute.</p><div class="card" style="max-width:none"><b>Heute im Stundenplan</b>${ls.length?`<div>${ls.map(x=>`<div class="row"><span class="m">${x[0]}. Stunde</span><span>${esc(x[1])}</span></div>`).join('')}</div>`:`<p class="m">${d<5?'Noch nichts eingetragen.':'Heute ist kein Schultag.'}</p>`}<p style="margin:14px 0 0"><button class="btn g" onclick="go('plan')">Stundenplan öffnen</button></p></div><h2>Neu für dich</h2><div class="grid">${nn.map(card).join('')||'<p class="m">Noch nichts da.</p>'}</div>`},
lern:()=>`<h1>Lernmaterial</h1><p class="m">Was suchst du?</p><div class="tiles" style="margin-top:20px">${tl([['stoff','Stoff','Zusammenfassungen und Material','_stoff'],['notes','Mitschriften','Notizen und GoodNotes-PDFs','_notes']])}</div>`,
schule:()=>`<h1>${esc(S.school||'Meine Schule')}</h1><p class="m">Hier findest du den Chat und deine Mitschüler.</p>${S.school?'':`<button class="btn g" onclick="go('profil')">Schule im Profil eintragen</button>`}<div class="tiles" style="margin-top:20px">${tl([['chat','Chat','Klasse, Gruppen, privat','chat'],['school','Schülerliste','Öffentliche Profile','schueler'],['user','Freunde','Per Nummer hinzufügen','freunde']])}</div>`,
schueler:()=>`<h1>Schülerliste</h1><p class="m">${S.vis=='Privat'?'Du bist privat und erscheinst hier nicht.':'Du erscheinst hier öffentlich. Das änderst du in den Einstellungen.'}</p><div class="card" style="padding:6px 24px">${STUD.filter(s=>s[3]).map(s=>`<div class="row"><span>${s[0]}<span class="m">, Klasse ${s[1]}</span></span><button class="btn ${ql(s)?'g':'o'}" onclick="rq(${s[2]})">${ql(s)||'Anfrage senden'}</button></div>`).join('')}</div>`,
freunde:()=>`<h1>Freunde</h1><p class="m">Jede Person hat eine Nummer. Damit kannst du sie direkt hinzufügen, auch wenn sie nicht in der Schülerliste steht.</p><div class="card"><p class="m" style="margin:0">Deine Nummer</p><h1 style="margin:2px 0 0;letter-spacing:.06em">${fmt(pid())}</h1><label>Nummer einer anderen Person</label><div class="bar" style="margin:0"><input id="fn" inputmode="numeric" placeholder="000 000" onkeydown="event.key=='Enter'&&fadd()"><button class="btn o" onclick="fadd()">Anfrage senden</button></div></div>${S.fr===false?'<p class="m">Du erhältst gerade keine Anfragen. Das änderst du in den Einstellungen.</p>':FR.inc.length?`<h2>Anfragen an dich</h2><div class="card" style="padding:6px 24px;max-width:none">${FR.inc.map(p=>`<div class="row"><span>${nm(p)}</span><button class="btn o" onclick="facc(${p})">Annehmen</button></div>`).join('')}</div>`:''}<h2>Deine Freunde</h2><div class="card" style="padding:6px 24px;max-width:none">${FR.friends.length?FR.friends.map(p=>`<div class="row"><span>${nm(p)}</span></div>`).join(''):'<p class="m">Noch keine Freunde.</p>'}</div>${FR.sent.length?`<h2>Gesendet</h2><div class="card" style="padding:6px 24px;max-width:none">${FR.sent.map(p=>`<div class="row"><span>${nm(p)}</span><span class="m">Angefragt</span></div>`).join('')}</div>`:''}`,
plan:()=>{const t=(new Date().getDay()+6)%7,pl=S.plan||{};return `<h1>Stundenplan</h1><p class="m">Tippe in ein Feld und trag dein Fach ein. Es wird automatisch gespeichert.</p><div class="plan"><span></span>${DAYS.map((d,i)=>`<b class="${i==t?'today':''}">${d}</b>`).join('')}${Array.from({length:ROWS},(_,r)=>`<span class="hr">${r+1}</span>${DAYS.map((_,c)=>`<div class="pc"><input class="${pl[c+'-'+r]?'f':''}" style="${pcs((S.pc||{})[c+'-'+r])}" aria-label="${DAYS[c]}, ${r+1}. Stunde" value="${esc(pl[c+'-'+r]||'')}" oninput="ps('${c}-${r}',this)"><i class="dt" role="button" aria-label="Farbe ändern" style="background:${(S.pc||{})[c+'-'+r]||'transparent'}" onclick="pc('${c}-${r}',this)"></i></div>`).join('')}`).join('')}</div>`},
profil:()=>{const m=DB.filter(x=>x.mine);return `<div style="text-align:center;margin-top:12px"><img class="av" src="${S.avc||AVATARS[S.av||0]}" alt="Profilbild"><h1>${esc(S.name||'Mein Profil')}</h1><p class="m">${[S.stufe&&'Stufe '+S.stufe,S.klasse&&'Klasse '+S.klasse,S.school].filter(Boolean).map(esc).join(', ')||'Trag unten deine Angaben ein.'}</p><p>Deine Nummer: <b>${fmt(pid())}</b></p></div><div class="card" style="padding:18px 24px"><p class="m" style="margin:0 0 12px">Profilbild</p><div class="chips" style="gap:12px;align-items:center">${AVATARS.map((a,i)=>`<img class="avc ${!S.avc&&(S.av||0)==i?'on':''}" src="${a}" alt="Standardbild ${i+1}" onclick="sv('av',${i});sv('avc','');render()">`).join('')}<label class="btn g" style="margin:0;font-size:15px">Eigenes Bild<input type="file" accept="image/*" hidden onchange="avUp(this)"></label>${S.avc?`<button class="btn g" onclick="sv('avc','');render()">Entfernen</button>`:''}</div></div><div class="card" style="padding:6px 24px">${SP.PF()}</div><h2>Meine Uploads</h2><div class="grid">${m.map(card).join('')||'<p class="m">Noch nichts hochgeladen.</p>'}</div>`},
sec:()=>{const t=P.t,f=F[t],T=TY[t];
if(!f.go)return `<h1>${T.n}</h1><p class="m">${T.s}. Wähle zuerst Klasse und Bundesland.</p><div class="card"><label>Klasse</label><div class="chips">${STU.map(s=>`<span class="chip ${f.stufe==s?'on':''}" onclick="fp('stufe',${s})">${s}</span>`).join('')}</div><label>Bundesland</label><div class="chips"><span class="chip ${f.rlp?'on':''}" onclick="fp('rlp',1)">Rheinland-Pfalz</span><span class="chip ${f.rlp?'':'on'}" onclick="fp('rlp',0)">Anderes Bundesland</span></div>${f.rlp?'':`<select style="margin-top:10px" onchange="F['${t}'].land=this.value">${LAND.slice(1).map(l=>`<option ${l==f.land?'selected':''}>${l}</option>`).join('')}</select>`}<p style="margin:22px 0 0"><button class="btn o" onclick="fgo()">Ergebnisse anzeigen</button></p></div>`;
return `<h1>${T.n}</h1><div class="bar">${t!='all'?`<span class="chip on" onclick="F['${t}'].go=0;render()">Klasse ${f.stufe}, ${f.land}, ändern</span>`:''}<input placeholder="Suchen, zum Beispiel Deutsch" aria-label="Suche" value="${esc(f.q)}" oninput="F['${t}'].q=this.value;$('#gr').innerHTML=gr()">${t!='all'?`<button class="btn o" onclick="nw('${t}')">${T.one}</button>`:''}</div><div class="grid" id="gr">${gr()}</div>`},
neu:()=>`<h1>${TY[cur.type].one}</h1><p class="m">Lege zuerst den Ordner an. Die Seiten lädst du im nächsten Schritt hoch.</p><div class="card"><label>Titel</label><input placeholder="Zum Beispiel Deutsch 7" oninput="u('title',this.value)" value="${esc(cur.title)}"><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}<label>Bundesland</label>${sel('land',LAND)}<p style="margin:22px 0 0"><button class="btn o" onclick="mkd()">Weiter</button></p></div>`,
edit:()=>`<h1>${TY[cur.type].one} einrichten</h1><div class="ed"><div><div id="pv"></div><label>Cover (optional)</label><input type="file" accept="image/*" onchange="cov(this)"></div><div><label style="margin-top:0">Titel</label><input value="${esc(cur.title)}" oninput="u('title',this.value)"><label>Beschreibung (optional)</label><textarea rows="3" oninput="u('desc',this.value)">${esc(cur.desc)}</textarea><label>Farbe</label><div class="sw">${COL.map(c=>`<i class="${c==cur.color?'on':''}" style="background:${c}" onclick="u('color','${c}');this.parentNode.querySelectorAll('i').forEach(i=>i.classList.toggle('on',i==this))"></i>`).join('')}</div><label>Fach</label>${sel('fach',FACH)}<label>Klasse</label>${sel('stufe',STU)}<label>Bundesland</label>${sel('land',LAND)}<label>Schule (optional)</label><input value="${esc(cur.school)}" oninput="u('school',this.value)"></div></div><h2>Seiten hochladen</h2><p class="m" style="margin:-4px 0 12px">Hochgeladene Seiten werden noch nicht dauerhaft gespeichert. Sie bleiben nur, bis du die Seite neu lädst.</p><label class="drop">Bilder oder PDFs auswählen, auch GoodNotes-Exporte<input type="file" multiple hidden accept="image/*,application/pdf" onchange="up(this)"></label><div class="thumbs" id="th"></div><button class="btn o" onclick="go('view',{id:cur.id},1)">Fertig</button>`,
view:()=>`<div class="bar" style="margin-bottom:0"><h1 style="flex:1;margin:0">${esc(cur.title)}</h1>${cur.pages.length?`<button class="btn g" onclick="dl(0)">Seite als PDF</button><button class="btn g" onclick="dl(1)">Alles als PDF</button>`:''}<button class="btn g" onclick="go('edit',{id:cur.id})">Bearbeiten</button></div><p class="m">${cur.fach}, Klasse ${cur.stufe}, ${cur.land}${cur.desc?'. '+esc(cur.desc):''}</p>${cur.pages.length?`<div class="stage"><button class="ib" aria-label="Zurückblättern" onclick="show(-1)">${ic('back')}</button><div class="book" id="bk"></div><button class="ib nx" aria-label="Weiterblättern" onclick="show(1)">${ic('back')}</button></div><div class="pn" id="pn"></div>`:`<div class="card"><p class="m" style="margin-top:0">Noch keine Seiten.</p><button class="btn o" onclick="go('edit',{id:cur.id})">Seiten hochladen</button></div>`}`,
chat:()=>`<h1>Chat</h1><div class="bar" style="margin:8px 0"><button class="btn g" onclick="ct=ct=='new'?0:'new';render()">Neue Gruppe</button><button class="btn g" onclick="ct=ct=='join'?0:'join';render()">Schlüssel eingeben</button></div>${ct?`<div class="bar"><input id="cx" placeholder="${ct=='new'?'Name der Gruppe':'Schlüssel'}" onkeydown="event.key=='Enter'&&cgo()"><button class="btn o" onclick="cgo()">${ct=='new'?'Erstellen':'Beitreten'}</button></div>`:''}<div class="chips" style="margin-top:12px">${Object.keys(CH).map(c=>`<span class="chip ${c==ch?'on':''}" onclick="ch='${c}';render()">${c}${KEYS[c]?' (privat)':''}</span>`).join('')}</div>${KEYS[ch]?`<p class="m" style="margin:12px 0 0">Privater Chat. Schlüssel: <b>${KEYS[ch]}</b>. Gib ihn nur an Personen, die beitreten sollen.</p>`:''}<div class="card" id="ms"></div><div class="bar"><input id="mi" placeholder="Nachricht schreiben" onkeydown="event.key=='Enter'&&snd()"><button class="btn o" onclick="snd()">Senden</button></div>`,
set:()=>`<h1>Einstellungen</h1><div class="tabs">${['Konto','Darstellung','Privatsphäre'].map(t=>`<button class="tab ${t==st?'on':''}" onclick="st='${t}';render()">${t}</button>`).join('')}</div><div class="card" style="padding:6px 24px;margin-top:16px">${SP[st]()}</div>`};
const SP={
Konto:()=>`<div class="row"><span>Profil mit Name, Schule, Klasse und Stufe</span><button class="btn g" onclick="go('profil')">Bearbeiten</button></div><div class="row"><span class="m">Anmeldung und Passwort folgen mit dem Account-System.</span></div>`,
PF:()=>`<div class="row"><span>Anzeigename</span><input style="max-width:220px" value="${esc(S.name||'')}" oninput="sv('name',this.value)"></div><div class="row"><span>Schule</span><input style="max-width:220px" value="${esc(S.school||'')}" oninput="sv('school',this.value)"></div><div class="row"><span>Klasse</span><input style="max-width:120px" placeholder="z. B. 7a" value="${esc(S.klasse||'')}" oninput="sv('klasse',this.value)"></div><div class="row"><span>Stufe</span><select style="max-width:120px" onchange="sv('stufe',this.value)"><option value="">–</option>${STU.map(v=>`<option ${v==S.stufe?'selected':''}>${v}</option>`).join('')}</select></div>`,
Darstellung:()=>`<div class="row"><span>Darkmode</span><input type="checkbox" ${isDark()?'checked':''} onchange="sv('dark',this.checked)"></div>`,
Privatsphäre:()=>`<div class="row"><span>In der Schülerliste sichtbar</span><div class="chips">${['Öffentlich','Privat'].map(v=>`<span class="chip ${(S.vis||'Öffentlich')==v?'on':''}" onclick="sv('vis','${v}');render()">${v}</span>`).join('')}</div></div><div class="row"><span>Freundschaftsanfragen erhalten</span><input type="checkbox" ${S.fr!==false?'checked':''} onchange="sv('fr',this.checked)"></div>`};
theme();render();
</script></body></html>
